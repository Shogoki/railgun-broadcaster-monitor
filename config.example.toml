# railgun-broadcaster-monitor – example configuration
#
# Everything in here is PUBLIC data. The dashboard never needs (and has no field for)
# a mnemonic, private key or viewing key. Do not point it at the broadcaster's
# config.yaml – copy the public bits you need into this file instead.

[broadcaster]
name = "my-broadcaster"
# EVM gas wallet (same address on all chains)
gas_wallet = "0x1111111111111111111111111111111111111111"
# Broadcaster 0zk address – used to find our own offers on Waku
railgun_address = "0zk1qyqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqj7m8ay"

[source]
# stdin    : `docker logs -f railgun-broadcaster 2>&1 | rbm run -c rbm.toml`
# command  : rbm spawns `command` itself and restarts it (with --since) when it exits
# journald : rbm follows `journalctl -f -o json <journald_match>` and resumes from its cursor
#            (requires the broadcaster container to use the journald logging driver)
# none     : no live logs (dashboard + enrichment only)
kind = "journald"
journald_match = ["CONTAINER_NAME=railgun-broadcaster"]
# command = ["docker", "logs", "-f", "--since", "{since}", "railgun-broadcaster"]

[web]
# Keep it on loopback and use `ssh -L 8080:localhost:8080 <host>`.
bind = "127.0.0.1:8080"
# basic_auth = "user:password"   # or env RBM_BASIC_AUTH; required for non-loopback binds

[storage]
# Relative to the working directory. deploy/install.sh sets /var/lib/rbm/rbm.sqlite,
# the Docker image expects /data/rbm.sqlite.
path = "rbm.sqlite"
raw_events_days = 14
fee_history_days = 7
market_history_days = 365

[waku]
enabled = true
max_peers = 6
sample_secs = 600        # market summary per chain/token
fee_sample_secs = 1800   # every broadcaster's rate (history)
pool_factor = 1.05       # random-selection pool (few wallets use it; Railway/Terminal pick the cheapest)
# Wallets only consider offers within −10 % / +30 % of the average fee of these trusted
# signers (Railway remote config `trustedFeeSigner`). Defaults to the list of 2026-10-19.
# trusted_fee_signers = ["0zk1…"]
trusted_fee_lower = 0.10
trusted_fee_upper = 0.30

[health]
fee_publish_warn_secs = 180
fee_publish_stale_secs = 600
# container_inspect = ["docker", "inspect", "railgun-broadcaster"]  # needs docker access (root-equivalent)
balance_poll_secs = 300
price_poll_secs = 300

[rpc]
timeout_secs = 10
cooldown_secs = 60

# ---------------------------------------------------------------- Ethereum
[[chain]]
id = 1
name = "Ethereum"
native_symbol = "ETH"
explorer_tx = "https://etherscan.io/tx/"
explorer_address = "https://etherscan.io/address/"
# 1rpc.io hits usage limits often; api.zan.top blocks eth_call without an account.
rpcs = ["https://ethereum-rpc.publicnode.com", "https://eth.drpc.org"]
relay_adapt = ["0xAc9f360Ae85469B27aEDdEaFC579Ef2d052aD405"]
fee_bonus = 0.05
